services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphagent-dev
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.7-code-highspeed}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      NOSANA_API_KEY: ${NOSANA_API_KEY:-}
      NOSANA_API_URL: ${NOSANA_API_URL:-https://dashboard.k8s.prd.nos.ci/api}
      NOSANA_EMBEDDING_URL: ${NOSANA_EMBEDDING_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/graphagent-dev
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j-data:
