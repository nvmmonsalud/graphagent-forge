{
  "services": {
    "init": {
      "build": {
        "context": "../.."
      },
      "image": "graphagent-local-private:mac",
      "user": "0:0",
      "entrypoint": [
        "python",
        "/bootstrap/init_state.py"
      ],
      "network_mode": "none",
      "volumes": [
        "app-state:/app/data",
        {
          "type": "bind",
          "source": "${GRAPHAGENT_LOCAL_CONFIG:?run start.sh}/auth.json",
          "target": "/bootstrap/auth.json",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        },
        "./init_state.py:/bootstrap/init_state.py:ro"
      ],
      "restart": "no"
    },
    "app": {
      "build": {
        "context": "../.."
      },
      "image": "graphagent-local-private:mac",
      "user": "1000:1000",
      "command": [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
        "--no-proxy-headers",
        "--no-access-log",
        "--timeout-graceful-shutdown",
        "180"
      ],
      "depends_on": {
        "init": {
          "condition": "service_completed_successfully"
        },
        "neo4j": {
          "condition": "service_healthy"
        }
      },
      "ports": [
        "127.0.0.1:8000:8000"
      ],
      "env_file": [
        "${GRAPHAGENT_LOCAL_CONFIG:?run start.sh}/app-db.env"
      ],
      "environment": {
        "AUTH_MODE": "private",
        "AUTH_CONFIG_PATH": "/app/data/auth.json",
        "STATE_DB_PATH": "/app/data/identity.sqlite3",
        "AUTH_COOKIE_SECURE": "0",
        "ALLOWED_ORIGINS": "http://127.0.0.1:8000",
        "NEO4J_URI": "bolt://neo4j:7687",
        "NEO4J_USER": "neo4j",
        "KIMI_API_KEY": "",
        "DAYTONA_API_KEY": "",
        "NOSANA_API_KEY": "",
        "NOSANA_EMBEDDING_URL": "",
        "USAGE_REQUEST_LIMIT": "100",
        "USAGE_WINDOW_SECONDS": "3600",
        "ENABLE_API_DOCS": "0",
        "DEV_RELOAD": "0"
      },
      "volumes": [
        "app-state:/app/data"
      ],
      "networks": [
        "private"
      ],
      "stop_grace_period": "210s",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "none"
      }
    },
    "neo4j": {
      "image": "neo4j:5.26-community",
      "env_file": [
        "${GRAPHAGENT_LOCAL_CONFIG:?run start.sh}/neo4j.env"
      ],
      "environment": {
        "NEO4J_server_memory_heap_initial__size": "256m",
        "NEO4J_server_memory_heap_max__size": "768m",
        "NEO4J_server_memory_pagecache_size": "256m",
        "NEO4J_dbms_usage__report_enabled": "false"
      },
      "volumes": [
        "neo4j-data:/data"
      ],
      "networks": [
        "private"
      ],
      "stop_grace_period": "120s",
      "logging": {
        "driver": "none"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q --spider http://localhost:7474 || exit 1"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 18,
        "start_period": "30s"
      }
    }
  },
  "networks": {
    "private": {
      "internal": true
    }
  },
  "volumes": {
    "app-state": {},
    "neo4j-data": {}
  }
}
