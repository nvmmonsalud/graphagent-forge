[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: requires a live Neo4j",
    "browser: opt-in Chromium frontend regressions (use --browser)",
    "hosted: opt-in local connected acceptance (use --hosted)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]
