services:
  app:
    build: .
    # Loopback only: the app's mutating routes are open unless API_KEY is set.
    # Set APP_PUBLISH=0.0.0.0 (and API_KEY) to expose it on the network.
    ports:
      - "${APP_PUBLISH:-127.0.0.1}:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphagent-dev}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.7-code-highspeed}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      NOSANA_API_KEY: ${NOSANA_API_KEY:-}
      NOSANA_API_URL: ${NOSANA_API_URL:-https://dashboard.k8s.prd.nos.ci/api}
      NOSANA_EMBEDDING_URL: ${NOSANA_EMBEDDING_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_MERGE: ${AUTO_MERGE:-}
      STATE_DB_PATH: ${STATE_DB_PATH:-}
      INGEST_ATTEMPT_BUDGET: ${INGEST_ATTEMPT_BUDGET:-100}
      INGEST_JOB_TIMEOUT: ${INGEST_JOB_TIMEOUT:-600}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      DEV_RELOAD: ${DEV_RELOAD:-0}
    volumes:
      - app-state:/app/data
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26
    # The app reaches Neo4j over the compose network; these host mappings exist
    # only for local debugging (browser / cypher-shell) and stay on loopback so
    # nobody else on the network can talk to the database directly.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphagent-dev}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  app-state:
  neo4j-data:
