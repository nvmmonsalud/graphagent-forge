{
  "name": "H1 local release gates",
  "on": {
    "push": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "hosted_acceptance": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Set up Java 21",
          "uses": "actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3",
          "with": {
            "distribution": "temurin",
            "java-version": "21"
          }
        },
        {
          "name": "Install connected acceptance dependencies",
          "run": "python -m pip install -r requirements-hosted.txt"
        },
        {
          "name": "Install Chromium",
          "run": "python -m playwright install --with-deps chromium"
        },
        {
          "name": "Verify disposable Neo4j distribution and private fixture directory",
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\ndistribution=\"$(mktemp -d \"$RUNNER_TEMP/h1-neo4j.XXXXXX\")\"\narchive=\"$distribution/neo4j.tar.gz\"\ncurl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --max-redirs 3 --connect-timeout 15 --max-time 120 --retry 2 --retry-max-time 300 --output \"$archive\" https://dist.neo4j.org/neo4j-community-5.26.0-unix.tar.gz\nprintf '%s  %s\\n' ad8ac3398606145502b8f489530bbd39333707ae4668156af16b6086b5b037d7 \"$archive\" | sha256sum --check --status\ntar --extract --gzip --file \"$archive\" --directory \"$distribution\" --no-same-owner\nprintf 'HOSTED_NEO4J_HOME=%s/neo4j-community-5.26.0\\n' \"$distribution\" >> \"$GITHUB_ENV\"\nfixtures=\"$(mktemp -d \"$RUNNER_TEMP/h1-fixtures.XXXXXX\")\"\nprintf 'TMPDIR=%s\\n' \"$fixtures\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Local connected acceptance (invented fixtures; private diagnostics stay on runner)",
          "run": "set -euo pipefail\numask 077\ndiagnostic=\"$(mktemp \"$TMPDIR/h1-pytest.XXXXXX\")\"\ntrap 'rm -f -- \"$diagnostic\"' EXIT\nif python -m pytest --hosted tests/hosted -q --tb=no --show-capture=no --disable-warnings > \"$diagnostic\" 2>&1; then\n  printf '%s\\n' 'H1 local connected acceptance passed.'\nelse\n  printf '%s\\n' 'H1 local connected acceptance failed; reproduce locally using docs/H1_LOCAL_ACCEPTANCE.md.'\n  exit 1\nfi",
          "shell": "bash"
        }
      ]
    },
    "image_gate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install pinned image dependency auditor",
          "run": "python -m pip install pip-audit==2.9.0"
        },
        {
          "name": "Build and inspect exact commit locally (no registry push or deployment)",
          "run": "python -m scripts.check_ci_image --commit \"$GITHUB_SHA\" --output-dir \"$RUNNER_TEMP/h1-image-evidence\" --json"
        },
        {
          "name": "Audit installed runtime image dependency inventory",
          "run": "python -m pip_audit --no-deps --disable-pip -r \"$RUNNER_TEMP/h1-image-evidence/runtime-requirements.txt\""
        },
        {
          "name": "Upload allowlisted public image metadata after successful checks",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "h1-image-public-metadata",
            "path": "${{ runner.temp }}/h1-image-evidence/report.json\n${{ runner.temp }}/h1-image-evidence/dependencies.json\n${{ runner.temp }}/h1-image-evidence/runtime-requirements.txt",
            "retention-days": 7,
            "if-no-files-found": "error",
            "include-hidden-files": false
          }
        }
      ]
    }
  }
}
